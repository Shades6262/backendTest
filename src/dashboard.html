<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Backend App</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #1e293b;
        border-bottom: 1px solid #334155;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        color: #38bdf8;
        font-size: 24px;
      }

      .logout-btn {
        background: #ef4444;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .logout-btn:hover {
        background: #dc2626;
      }

      main {
        flex: 1;
        padding: 40px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        margin-bottom: 25px;
      }

      .card h2 {
        color: #38bdf8;
        margin-bottom: 15px;
        font-size: 20px;
      }

      .info-group {
        margin-bottom: 15px;
      }

      .info-label {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 4px;
      }

      .info-value {
        font-size: 16px;
        color: #f8fafc;
        font-weight: 500;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        background: #3b82f6;
        color: #fff;
        border-radius: 20px;
        font-size: 12px;
        text-transform: uppercase;
        font-weight: bold;
      }

      .loading {
        text-align: center;
        color: #94a3b8;
        padding: 40px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>App Dashboard</h1>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </header>

    <main>
      <div id="loading" class="loading">Loading profile information...</div>
      
      <div id="dashboardContent" style="display: none;">
        <div class="card">
          <h2>Welcome back, <span id="userName">User</span>!</h2>
          <p style="color: #94a3b8; line-height: 1.5; margin-bottom: 25px;">
            You have successfully logged in and authenticated. Here is your account overview.
          </p>

          <div class="info-group">
            <div class="info-label">Full Name</div>
            <div class="info-value" id="profileName">-</div>
          </div>

          <div class="info-group">
            <div class="info-label">Email Address</div>
            <div class="info-value" id="profileEmail">-</div>
          </div>

          <div class="info-group">
            <div class="info-label">Role</div>
            <div class="info-value"><span class="badge" id="profileRole">user</span></div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API_URL = 'https://backendtest-ekev.onrender.com';
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
      }

      async function fetchProfile() {
        try {
          const res = await fetch(`${API_URL}/api/auth/profile`, {
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          const data = await res.json();

          if (res.ok) {
            document.getElementById('userName').textContent = data.user.name;
            document.getElementById('profileName').textContent = data.user.name;
            document.getElementById('profileEmail').textContent = data.user.email;
            document.getElementById('profileRole').textContent = data.user.role || 'user';

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
          } else {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }
        } catch (err) {
          console.error(err);
          document.getElementById('loading').textContent = 'Failed to load profile. Please log in again.';
          setTimeout(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
          }, 2000);
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
      });

      fetchProfile();
    </script>
  </body>
</html>
