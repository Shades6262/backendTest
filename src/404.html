<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/f9041d68b8.js" crossorigin="anonymous"></script>
</head>
<body>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 150px;">
        <img src="https://www.gstatic.com/youtube/src/web/htdocs/img/monkey.png" alt="Monkey" width="190px" height="175px">
        <p style="font-size: 18px; text-align: center;">This page isn't available. Sorry about that. <br>
            Try searching for something else.</p>
        <div style="display: flex; font-size: 25px;">
            <div>
                <span style="color: red;"><i class="fa-brands fa-youtube"></i></span>
                <span style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 500;">Youtube</span><sub style="font-size: 15px; color: rgb(70, 120, 173); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;">NG</sub>
            </div>
            <div style="display: flex; margin-left: 10px; width: 300px;">
                <input type="text" placeholder="Search" style="height: 20px; width: 70%;">
                <button style="height: 26px; width: 20%;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </div>
</body>
</html>
