<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Backend App</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #f8fafc;
      }

      form {
        background: #1e293b;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        border: 1px solid #334155;
      }

      h2 {
        margin-bottom: 20px;
        color: #38bdf8;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 6px;
        color: #fff;
        font-size: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #38bdf8;
        color: #0f172a;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-bottom: 12px;
      }

      button[type="submit"]:hover {
        background: #0ea5e9;
      }

      button[type="button"] {
        width: 100%;
        padding: 10px;
        background: transparent;
        color: #94a3b8;
        border: 1px solid #475569;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }

      button[type="button"]:hover {
        background: #334155;
        color: #f8fafc;
      }

      #message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <form id="resetForm">
      <h2>Create New Password</h2>
      <label for="password">New Password:</label>
      <input type="password" id="password" name="password" required />
      
      <button type="submit">Reset Password</button>
      <button type="button" onclick="window.location.href = 'login.html'">
        Back to Login
      </button>
      <div id="message"></div>
    </form>

    <script>
      const API_URL = 'http://localhost:5050';
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const msgDiv = document.getElementById('message');

      if (!token) {
        msgDiv.style.color = '#f87171';
        msgDiv.textContent = 'Invalid or missing reset token.';
        document.querySelector('button[type="submit"]').disabled = true;
      }

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;

        if (!token) {
          msgDiv.style.color = '#f87171';
          msgDiv.textContent = 'Missing reset token.';
          return;
        }

        try {
          const res = await fetch(`${API_URL}/api/auth/reset-password/${token}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          const data = await res.json();

          if (res.ok) {
            msgDiv.style.color = '#38bdf8';
            msgDiv.textContent = 'Password reset successfully! Redirecting to login...';
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          } else {
            msgDiv.style.color = '#f87171';
            msgDiv.textContent = data.message || 'Password reset failed';
          }
        } catch (err) {
          msgDiv.style.color = '#f87171';
          msgDiv.textContent = 'Server error. Please try again.';
        }
      });
    </script>
  </body>
</html>
